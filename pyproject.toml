[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-coder"
version = "0.3.0"
description = "An autonomous coding agent for local Ollama models — terminal UI, MCP, and a real permission model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lalo Morales" }]
keywords = [
  "ollama", "cli", "tui", "agent", "coding-assistant", "ai", "llm",
  "autonomous", "mcp", "local-llm", "textual",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "ollama>=0.5.0",
  "textual>=1.0.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# MCP servers. Optional only because the agent is fully usable without them.
mcp = ["mcp>=1.9.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "textual-dev>=1.6",
  "ruff>=0.6",
]
all = ["ollama-coder[mcp]"]

[project.urls]
Homepage = "https://github.com/lalomorales22/ollama-coder"
Repository = "https://github.com/lalomorales22/ollama-coder"
Issues = "https://github.com/lalomorales22/ollama-coder/issues"

[project.scripts]
ollama-coder = "ollama_coder.cli:main"
ollamacoder = "ollama_coder.cli:main"

[tool.setuptools]
packages = [
  "ollama_coder",
  "ollama_coder.core",
  "ollama_coder.tools",
  "ollama_coder.tui",
  "ollama_coder.mcpx",
]

[tool.setuptools.package-data]
ollama_coder = ["tui/*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
